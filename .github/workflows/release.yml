name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/restic_monitor/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/restic_monitor/manifest.json)
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" --title "v$version" --generate-notes --target "$GITHUB_SHA"
